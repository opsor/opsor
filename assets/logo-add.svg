<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- app icon: the white add mark on a dark tile, same construction as AFK -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(48 48) scale(2.5)">
    <g fill="#fff"><rect x="11" y="11" width="17" height="17" rx="4.5"/><rect x="36" y="11" width="17" height="17" rx="4.5"/><rect x="11" y="36" width="17" height="17" rx="4.5"/></g>
  <rect x="37.2" y="37.2" width="14.6" height="14.6" rx="4" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="3.6 3"/>
  </g>
</svg>
