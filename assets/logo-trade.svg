<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- app icon: the white trade mark on a dark tile, same construction as AFK -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(48 48) scale(2.5)">
    <g stroke="#fff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"><line x1="9" y1="17" x2="55" y2="17"/><line x1="9" y1="32" x2="55" y2="32"/><line x1="9" y1="47" x2="55" y2="47"/></g>
  <polyline points="10,43 21,22 33,38 45,16 55,27" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
